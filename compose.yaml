services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalkuresep
      POSTGRES_USER: kalkuresep
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalkuresep"]
      interval: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://kalkuresep:${DB_PASSWORD}@db:5432/kalkuresep
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FREE_RECIPE_LIMIT: ${FREE_RECIPE_LIMIT:-10}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
